---
# Compile the SBOM tools from the lockfiles that pin them, assemble them into
# relocatable per-ecosystem bundles, and publish those with build provenance.
#
# A bundle is what consumers actually fetch: one archive holding the tools we
# compile plus the toolchain they shell out to, unpacking into any writable
# directory. That is what lets the consumer run without root -- the historical
# alternative was `apt-get install` at run time, which needs root and pins
# nothing.
#
# Four platforms: linux and darwin, amd64 and arm64. Darwin is here because the
# tools are useful to a developer before they are useful to a pipeline -- a
# consumer who wants to see what an SBOM of their project looks like, or why
# the one CI produced is empty, should not have to get a container involved.
# Each is built on a runner of its own kind rather than cross-compiled: Rust
# and PHP cannot be cross-compiled to macOS without Apple's SDK, and the
# binaries that could be are the ones whose smoke test is worth the least if it
# cannot be executed.
#
# Where things land follows the release model:
#
#   push to master   the "tools-rolling" pre-release, replaced in place
#   published tag    release assets, immutable for the life of the release
#
# Both are needed. A workflow artifact cannot serve as the rolling half: it
# requires authentication even on a public repository and expires after 90
# days, so nothing outside the run that produced it can fetch one. The
# pre-release gives a stable, public, unauthenticated URL, which is what lets
# a consumer's master exercise a bumped tool before a release is cut. Cutting
# a release to find out whether a bump works is backwards -- the release is
# the thing the bump might break.
name: Build

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Created once here rather than by whichever job gets there first: several
  # jobs racing to create one tag means several failures to swallow, and
  # swallowing them would hide a real one too.
  prepare-rolling:
    name: Ensure the rolling pre-release exists
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: tools-rolling
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false
          else
            gh release create "$TAG" \
              --title "Rolling bundles (master)" \
              --notes "Ecosystem bundles built from the lockfiles on master. Replaced on every push; not a supported download. Cut releases carry their own immutable copies." \
              --prerelease --latest=false --target "$GITHUB_SHA"
          fi

  # A version bump changes the URL through its template but not the digest
  # beside it, and a stale digest stops the build. Catching it here says which
  # pin needs refreshing; catching it during assembly says only that a
  # download was refused.
  pins:
    name: Verify the pinned digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/check_digests.py

  build-go:
    name: ${{ matrix.tool }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # platform is a real matrix dimension, so this is a 5x4 cross product,
        # and the include entries only fill in the four combinations whose
        # platform they name. Written as bare `include` entries it was not: an
        # include object whose keys are absent from the base matrix merges into
        # every combination, so each entry applied to all five tools and the
        # last simply overwrote the rest. Only one architecture was ever built.
        tool: [syft, cosign, crane, cyclonedx-gomod, cdxgen-launcher]
        platform: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
        include:
          - { platform: linux-amd64, goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { platform: linux-arm64, goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          # macos-15 is the arm64 image and macos-15-intel the x64 one; both
          # are standard runners, so both are free for a public repository.
          - { platform: darwin-amd64, goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { platform: darwin-arm64, goos: darwin, goarch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-go caches the module and build caches keyed on the lockfile.
      # Every tool shares one go.sum, so a warm cache from any of them speeds
      # up the rest: an unchanged dependency graph is a cache hit.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve the pinned module path and version
        id: pin
        run: |
          case "${{ matrix.tool }}" in
            syft)            MOD=github.com/anchore/syft;                PKG=$MOD/cmd/syft ;;
            cosign)          MOD=github.com/sigstore/cosign/v3;          PKG=$MOD/cmd/cosign ;;
            crane)           MOD=github.com/google/go-containerregistry; PKG=$MOD/cmd/crane ;;
            cyclonedx-gomod) MOD=github.com/CycloneDX/cyclonedx-gomod;   PKG=$MOD/cmd/cyclonedx-gomod ;;
            # Ours, and in this repository: a static launcher so cdxgen is a
            # normal executable on PATH. Its own package has no version to
            # resolve, so the module version stands in.
            cdxgen-launcher) MOD=github.com/sbomify/sbom-tools;           PKG=./cmd/cdxgen ;;
            *) echo "unknown tool ${{ matrix.tool }}" >&2; exit 1 ;;
          esac
          if [ "${{ matrix.tool }}" = "cdxgen-launcher" ]; then
            VERSION=$(git rev-parse --short HEAD)
          else
            VERSION=$(go list -m -f '{{ .Version }}' "$MOD")
          fi
          { echo "pkg=$PKG"; echo "version=${VERSION#v}"; echo "tag=$VERSION"; } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          # syft reports its version as "[not provided]" unless stamped, and
          # the SBOMs it produces record the generating tool's version -- an
          # unstamped build understates its own provenance. The others read it
          # from the module build info.
          LDFLAGS="-s -w"
          if [ "${{ matrix.tool }}" = "syft" ]; then
            LDFLAGS="$LDFLAGS -X main.version=${{ steps.pin.outputs.version }}"
            LDFLAGS="$LDFLAGS -X main.gitDescription=${{ steps.pin.outputs.tag }}"
          fi
          # -trimpath keeps runner paths out of the binary, so the build does
          # not depend on where it happened.
          go build -trimpath -ldflags="$LDFLAGS" \
            -o "dist/${{ matrix.tool }}-${{ matrix.platform }}" "${{ steps.pin.outputs.pkg }}"

      # Assert it, do not assume it: a binary that loads something from the
      # build machine works on the runner and fails in a distroless container
      # or on a Mac without Homebrew.
      - uses: ./.github/actions/assert-self-contained
        with:
          path: dist/${{ matrix.tool }}-${{ matrix.platform }}

      - name: Smoke test
        run: |
          BIN="dist/${{ matrix.tool }}-${{ matrix.platform }}"
          if [ "${{ matrix.tool }}" = "cdxgen-launcher" ]; then
            # The launcher has no version of its own to print: it execs the
            # bun sitting beside it in an assembled bundle, and outside one
            # there is nothing to exec. Asserting `--version` here asked it to
            # do the one thing it cannot, and it correctly refused -- which
            # failed the build. What is worth asserting is the refusal itself:
            # a clear diagnostic and a non-zero exit rather than a crash or a
            # silent success. Whether it finds bun when there *is* one is
            # covered by the integration suite, which assembles the bundle.
            if OUT=$("$BIN" --version 2>&1); then
              echo "::error::$BIN succeeded with no bun beside it" >&2
              exit 1
            fi
            echo "$OUT"
            case "$OUT" in
              *"bundle is incomplete"*) ;;
              *) echo "::error::$BIN failed without the expected diagnostic" >&2; exit 1 ;;
            esac
          else
            # Every platform runs natively on a runner of its own kind, so
            # this executes the binary rather than merely inspecting it.
            "$BIN" version || "$BIN" --version
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-${{ matrix.tool }}-${{ matrix.platform }}
          path: dist/${{ matrix.tool }}-${{ matrix.platform }}
          if-no-files-found: error

  build-php:
    name: php (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
        include:
          - { platform: linux-amd64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-amd64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Compiled rather than downloaded because php.net publishes no binaries
      # at all -- only source -- for either system. The alternative was a third
      # party's static build, which would have been the only component here not
      # coming from its own vendor.
      #
      # Two build steps rather than one with branches inside it, because the
      # two have almost nothing in common beyond the configure line: one needs
      # a container to get a different libc, the other needs Apple's SDK and
      # cannot have a container at all.
      #
      # Inside Alpine so it links against musl, which is what makes the result
      # static-pie and therefore relocatable into any container. Building on
      # the runner's glibc would produce a binary tied to that glibc.
      - name: Build PHP from the pinned php.net release (Linux, in Alpine)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=$(python3 -c "import json;print(json.load(open('php-release.json'))['php']['version'])")
          SHA=$(python3 -c "import json;print(json.load(open('php-release.json'))['php']['sha256'])")
          IMAGE=$(python3 -c "import json;b=json.load(open('php-release.json'))['builder'];print(b['image']+'@'+b['digest'])")
          echo "building php $VERSION in $IMAGE"
          docker run --rm -v "$PWD/dist:/out" "$IMAGE" sh -eu -c "
            apk add --no-cache build-base autoconf curl file re2c bison linux-headers \
              openssl-dev openssl-libs-static zlib-dev zlib-static binutils >/dev/null
            cd /tmp
            curl -sSLo php.tar.gz 'https://www.php.net/distributions/php-$VERSION.tar.gz'
            echo '$SHA  php.tar.gz' | sha256sum -c -
            tar xzf php.tar.gz && cd php-$VERSION
            # Only what Composer needs to run and resolve:
            #   phar    - composer ships as one
            #   openssl - packagist over HTTPS
            #   zlib    - compressed transfers
            #   iconv   - composer refuses to start without iconv or mbstring,
            #             and iconv is in musl while mbstring would pull in
            #             oniguruma
            #   filter/ctype/tokenizer - composer's own requirements
            # Extensions a *project* declares are irrelevant: nothing is
            # installed here, only resolved. Verified against guzzle, Slim and
            # laravel/framework, where this build returns exactly what Debian's
            # full-featured php-cli returns.
            ./configure \
              --disable-all --disable-cgi --disable-phpdbg --enable-cli \
              --enable-phar --enable-filter --enable-ctype --enable-tokenizer \
              --with-iconv --with-openssl --with-zlib --without-pear \
              --enable-static --disable-shared >/dev/null
            # -all-static is libtool's spelling; plain -static in LDFLAGS is
            # dropped and yields a dynamically linked binary.
            make -j\"\$(nproc)\" LDFLAGS=-all-static >/dev/null
            strip sapi/cli/php
            cp sapi/cli/php /out/php-${{ matrix.platform }}
          "

      # macOS cannot do any of the above: there is no container to build in,
      # and nothing to gain from one -- the libc a Mac binary links against is
      # the one Apple ships, and every Mac has it. So this is a plain native
      # build against the SDK, with one thing to arrange.
      #
      # OpenSSL is the exception. macOS has no usable OpenSSL for a build to
      # link against -- the system libraries are private and the headers were
      # removed years ago -- while php's openssl extension, which is what lets
      # Composer reach packagist over HTTPS, needs one. Homebrew's keg carries
      # libssl.a and libcrypto.a, so passing those explicitly links OpenSSL
      # into the binary rather than leaving a reference to /opt/homebrew that
      # no consumer's Mac can resolve. OPENSSL_LIBS and OPENSSL_CFLAGS are the
      # documented pkg-config overrides, so configure takes them verbatim
      # instead of asking pkg-config for the dylib.
      #
      # -all-static has no counterpart here: Apple ships no libSystem.a and the
      # linker refuses -static, so a Mach-O binary cannot be fully static. The
      # achievable form of the same property -- load nothing but the OS -- is
      # what assert-self-contained checks below.
      - name: Build PHP from the pinned php.net release (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=$(python3 -c "import json;print(json.load(open('php-release.json'))['php']['version'])")
          SHA=$(python3 -c "import json;print(json.load(open('php-release.json'))['php']['sha256'])")
          brew install --quiet openssl@3
          OPENSSL=$(brew --prefix openssl@3)
          echo "building php $VERSION against $(xcrun --show-sdk-version) SDK, openssl from $OPENSSL"
          WORK=$(mktemp -d)
          cd "$WORK"
          curl -sSLo php.tar.gz "https://www.php.net/distributions/php-$VERSION.tar.gz"
          echo "$SHA  php.tar.gz" | shasum -a 256 -c -
          tar xzf php.tar.gz
          cd "php-$VERSION"
          # The SDK's zlib.pc, so --with-zlib resolves against the system zlib
          # rather than whatever Homebrew happens to have installed.
          export PKG_CONFIG_PATH="$(xcrun --show-sdk-path)/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export OPENSSL_CFLAGS="-I$OPENSSL/include"
          export OPENSSL_LIBS="$OPENSSL/lib/libssl.a $OPENSSL/lib/libcrypto.a"
          # The same extension set as the Linux build above, for the same
          # reasons -- only what Composer needs to run and resolve. Keeping the
          # two lines identical is the point: a php that answers differently on
          # a Mac would make the bundle's SBOM depend on where it was produced.
          ./configure \
            --disable-all --disable-cgi --disable-phpdbg --enable-cli \
            --enable-phar --enable-filter --enable-ctype --enable-tokenizer \
            --with-iconv --with-openssl --with-zlib --without-pear \
            --enable-static --disable-shared >/dev/null
          make -j"$(sysctl -n hw.ncpu)" >/dev/null
          # strip rewrites the file and so invalidates the ad-hoc signature
          # ld64 put there, which on arm64 means the binary stops being
          # runnable at all. Re-sign rather than skip the strip: the symbol
          # table is several MB in a bundle whose size is the first thing
          # anyone notices.
          strip sapi/cli/php
          codesign --force --sign - sapi/cli/php
          cp sapi/cli/php "$GITHUB_WORKSPACE/dist/php-${{ matrix.platform }}"

      - uses: ./.github/actions/assert-self-contained
        with:
          path: dist/php-${{ matrix.platform }}

      - name: Smoke test
        run: |
          BIN="dist/php-${{ matrix.platform }}"
          # Every platform is built on a runner of its own kind, so all four
          # can be executed rather than only inspected.
          "./$BIN" --version
          # Every module the configure lines above enable on Composer's behalf,
          # not a sample of them. The failure this catches is configure drift:
          # a flag dropped, an alpine package gone missing, a Homebrew keg
          # renamed -- each still builds a working php, and the gap only shows
          # up later as a Composer error inside a consumer's bundle, far from
          # the change that caused it. It also keeps the two builds honest
          # about each other: one platform quietly losing openssl is a php that
          # cannot reach packagist, on that platform only.
          # Names as `php -m` prints them -- it is case-sensitive, and Phar is
          # the one that is capitalised.
          MODULES=$("./$BIN" -m)
          for module in iconv Phar openssl zlib filter ctype tokenizer; do
            if ! printf '%s\n' "$MODULES" | grep -qx "$module"; then
              echo "::error::$module missing from the build" >&2
              echo "$MODULES" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-php-${{ matrix.platform }}
          path: dist/php-${{ matrix.platform }}
          if-no-files-found: error

  build-rust:
    name: cargo-cyclonedx (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
        include:
          - { platform: linux-amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # No musl counterpart, and none wanted: a Mac binary links against
          # the libSystem Apple ships, which is the one every Mac has.
          - { platform: darwin-amd64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: darwin-arm64, runner: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # musl-tools supplies the linker; rust-toolchain.toml pins the compiler
      # and all four targets, which rustup installs on first use. macOS needs
      # nothing equivalent -- the Xcode command line tools on the image already
      # supply the linker for its own target.
      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache the cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.platform }}-

      - name: Resolve the pinned version
        id: pin
        run: |
          # `cargo install <crate>` resolves from crates.io and ignores the
          # manifest in the working directory, so without an explicit
          # --version this would build whatever is newest and quietly defeat
          # the pin. Cargo.lock is the pin; read it.
          VERSION=$(python3 -c "
          import tomllib, pathlib
          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          print(next(p['version'] for p in lock['package'] if p['name'] == 'cargo-cyclonedx'))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          mkdir -p dist
          # --locked additionally builds the crate's own recorded dependency
          # versions rather than re-resolving them.
          # --target musl: statically linked, so the binary does not depend on
          # whatever libc happens to be in the container it is unpacked into.
          cargo install cargo-cyclonedx \
            --version "${{ steps.pin.outputs.version }}" --locked \
            --target "${{ matrix.target }}" --root ./cargo-out
          cp cargo-out/bin/cargo-cyclonedx "dist/cargo-cyclonedx-${{ matrix.platform }}"

      - uses: ./.github/actions/assert-self-contained
        with:
          path: dist/cargo-cyclonedx-${{ matrix.platform }}

      - name: Smoke test
        run: |
          BIN="dist/cargo-cyclonedx-${{ matrix.platform }}"
          # A cargo subcommand: run directly it still wants the subcommand
          # name as argv[1], exactly as the action invokes it. Plain
          # `--version` gets parsed as a cargo command and exits 2.
          "$BIN" cyclonedx --help >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-cargo-cyclonedx-${{ matrix.platform }}
          path: dist/cargo-cyclonedx-${{ matrix.platform }}
          if-no-files-found: error

  # The bundles are the published artifact, so they are what gets attested:
  # one signature over the thing a consumer actually downloads, rather than
  # over a binary that is only an ingredient.
  assemble:
    name: bundle ${{ matrix.bundle }} (${{ matrix.platform }})
    needs: [prepare-rolling, build-go, build-rust, build-php]
    if: always() && needs.build-go.result == 'success' && needs.build-rust.result == 'success'
      && needs.build-php.result == 'success'
    # Assembled on the platform being assembled for. Building arm64 on an
    # amd64 runner meant the pinned bun in the prefix could not be executed, so
    # the cdxgen install had to borrow a second, unpinned bun from the host --
    # and it left the "runs unpacked" check skipped for every arm64 bundle,
    # which was half of what we published. The same argument now covers the
    # operating system: a darwin bundle's bun has to run to populate
    # node_modules, and only a Mac can run it.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write # OIDC identity for keyless attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        bundle: [go, rust, jvm, dotnet, php, cdxgen, syft, sigstore]
        platform: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
        include:
          - { platform: linux-amd64, os: linux, arch: amd64, runner: ubuntu-latest }
          - { platform: linux-arm64, os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-amd64, os: darwin, arch: amd64, runner: macos-15-intel }
          - { platform: darwin-arm64, os: darwin, arch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The script reads bundles.toml, so it needs a Python with tomllib. The
      # macOS images ship a python3 whose version is not ours to choose.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tool-*-${{ matrix.platform }}
          path: dist
          merge-multiple: true

      # The vendor toolchains each bundle unpacks -- a 190MB JDK, a larger
      # .NET SDK, Go, Rust, Gradle, Maven, sbt, bun. Fourteen jobs were
      # fetching all of it from vendor CDNs on every build, for artifacts
      # pinned to an exact digest and therefore incapable of changing.
      #
      # Keyed per bundle, not per architecture. Sharing one key across the
      # seven bundle jobs meant they raced for it -- six lost with "Unable to
      # reserve cache with key ..., another job may be creating this cache" --
      # and the winner saved only the subset it had downloaded. The next build
      # then found nothing and fetched everything again, which is how the first
      # version of this cache managed to never once hit.
      #
      # bundles.toml holds the pins, so a version bump changes the key and the
      # new artifact is fetched once. Entries are named by digest and re-hashed
      # before use, so a restored cache can only ever supply the exact bytes
      # the manifest asks for.
      - name: Cache the pinned vendor downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sbom-tools/downloads
          key: vendor-${{ matrix.bundle }}-${{ matrix.platform }}-${{ hashFiles('bundles.toml') }}
          restore-keys: vendor-${{ matrix.bundle }}-${{ matrix.platform }}-

      - name: Assemble
        run: |
          python3 scripts/assemble_bundle.py --bundle ${{ matrix.bundle }} \
            --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Verify it runs unpacked, as a plain user
        run: |
          ARCHIVE="out/${{ matrix.bundle }}-${{ matrix.platform }}.tar.gz"
          PREFIX=$(mktemp -d)
          tar xzf "$ARCHIVE" -C "$PREFIX"
          test -f "$PREFIX/bundle.toml"
          # Every platform now, because the runner matches the one being
          # built. HOME=/ is unwritable, which is the case that broke the old
          # design: every tool must keep its caches inside the prefix.
          for bin in "$PREFIX"/bin/*; do
            env -i HOME=/ PATH="$PREFIX/bin:/usr/bin:/bin" "$bin" --version >/dev/null 2>&1 \
              || env -i HOME=/ PATH="$PREFIX/bin:/usr/bin:/bin" "$bin" version >/dev/null 2>&1 \
              || echo "note: $(basename "$bin") has no version flag"
          done
          # macOS has no sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            shasum -a 256 "$ARCHIVE" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.2.4.2.2
        with:
          subject-path: out/${{ matrix.bundle }}-${{ matrix.platform }}.tar.gz

      # Published next to the bundle it describes. GitHub keeps a copy behind
      # its attestations API, but that is not a usable fetch path: the bundle
      # comes back through a redirect to blob storage under an undocumented
      # binary framing, and depending on an unversioned internal format to
      # verify a supply chain is not a trade worth making.
      - name: Stage the attestation bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "out/${{ matrix.bundle }}-${{ matrix.platform }}.tar.gz.sigstore.json"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="tools-rolling"
          fi
          gh release upload "$TAG" \
            "out/${{ matrix.bundle }}-${{ matrix.platform }}.tar.gz" \
            "out/${{ matrix.bundle }}-${{ matrix.platform }}.tar.gz.sigstore.json" --clobber
