---
# Test the bundles against real projects, in both formats.
#
# build.yml proves a bundle assembles and attests. It cannot prove the tools
# inside it produce an SBOM of a real project, and every defect worth finding
# so far has been of the second kind: the .NET SDK sitting at the payload root
# so nothing reached PATH; sbt 2.x whose launcher dies before a build loads; a
# Gradle plugin class spelled CyclonedxPlugin rather than CycloneDxPlugin.
# Each assembled, verified and published perfectly well.
#
# Runs after build.yml so it exercises what was just published, and on a
# schedule so upstream drift in the projects themselves surfaces here rather
# than in someone's pipeline.
name: Integration

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  schedule:
    # Weekly. The projects are pinned to tags, so this catches rot in the
    # tools and registries rather than in the projects.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      bundle:
        description: "Only test this bundle"
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.bundle }} (${{ matrix.platform }})
    # A bundle can take a while: Keycloak is a large reactor and Gradle
    # resolves from the network.
    timeout-minutes: 90
    # Matched to the platform being tested. This once ran amd64 Linux only, so
    # three quarters of what we publish had generated an SBOM exactly never --
    # build.yml executes each binary for its version string, which proves it
    # loads, not that it can resolve a real project's dependencies. An
    # immutable release should not be the first time that is tried.
    #
    # macOS is where this matters most, because it is where the toolchains the
    # bundles carry differ from the ones they carry on Linux: a different JDK
    # layout, a different .NET SDK, a php linked a different way. Those are
    # exactly the differences a build cannot catch. GitHub runs fewer macOS
    # jobs concurrently than Linux ones, so the twelve here queue rather than
    # fan out; fail-fast stays off so a slow one does not cancel the rest.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        bundle: [jvm, go, rust, dotnet, cdxgen, php]
        platform: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
        include:
          - { platform: linux-amd64, os: linux, arch: amd64, runner: ubuntu-latest }
          - { platform: linux-arm64, os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-amd64, os: darwin, arch: amd64, runner: macos-15-intel }
          - { platform: darwin-arm64, os: darwin, arch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Cloned projects and unpacked bundles, keyed on the manifests that
      # decide them. Keycloak alone is a 90MB clone.
      - name: Cache projects and bundles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sbom-tools-it
          key: it-${{ matrix.bundle }}-${{ matrix.platform }}-${{ hashFiles('tests/projects.toml', 'bundles.toml') }}
          restore-keys: it-${{ matrix.bundle }}-${{ matrix.platform }}-

      - name: Run
        if: github.event.inputs.bundle == '' || github.event.inputs.bundle == matrix.bundle
        run: |
          python tests/integration.py --bundle ${{ matrix.bundle }} \
            --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Report
        if: always()
        run: |
          echo "bundle ${{ matrix.bundle }} (${{ matrix.platform }}) - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
