---
# SBOMs for everything this repository builds and ships.
#
# Two kinds of thing need describing, and only the first was ever covered:
#
#   sources   the lock files we build from -- go.mod, Cargo.lock, bun.lock,
#             and the JVM plugin manifests
#   bundles   the archives users actually download, which additionally carry
#             a JDK, Maven, Gradle, sbt, the Go and Rust toolchains, the .NET
#             SDK and bun
#
# The second is the larger supply chain by far and had no SBOM at all. A user
# fetching the jvm bundle gets ~466MB of toolchain; describing only the four Go
# modules we compiled would answer a question nobody asked.
#
# Bundles are scanned with the syft from the syft bundle, fetched once per job.
# The first version used the syft inside each bundle, which is wrong: the
# sigstore bundle ships cosign and crane and nothing else, so that job died
# with "unpacked/bin/syft: No such file or directory". Taking the scanner from
# a known bundle rather than the one under test also means the scanner does
# not vary with the subject.
#
# Pointing the action at the unpacked directory would be better -- it adds the
# enrichment and augmentation this raw scan skips -- and sbomify-action grew a
# SOURCE_DIR input for exactly that. It is not usable here yet.
#
# The blocker is a bug in the action, not the age of the image. #29 switched
# to SOURCE_DIR and every bundle job failed: the image printed its usage and
# exited 0, so no SBOM was written and the emptiness check below died on a
# missing file. The image was current -- its banner read v26.7.0+6b3fd61, the
# master commit that carries SOURCE_DIR.
#
# The cause is sbomify-action dropping the value in three places: the "did the
# user give us an input?" check, the call into build_config, and build_config's
# own Config(...). SOURCE_DIR alone therefore read as no input at all: print
# help, exit 0, do nothing. Green step, no SBOM. Fixed in sbomify-action#340.
# Reverted here in #30.
#
# No release is needed to pick that up. :latest is built from master -- the
# image that failed here reported revision 6b3fd61, a master merge commit --
# so merging #340 and letting its pipeline finish republishes :latest.
#
# Wait for that pipeline, then confirm against the image rather than the
# commit, since only the image is what this workflow runs:
#
#   docker run --rm ghcr.io/sbomify/sbomify-action:latest \
#     --source-dir /tmp --upload false 2>&1 | head -5
#
# If that prints the usage banner instead of starting a scan, the fix has not
# landed in the image yet. Once it scans, replace the syft scan and SBOM_FILE
# below with SOURCE_DIR: unpacked.
#
# An earlier attempt used LOCK_FILE for a directory and failed with "Specified
# input file 'unpacked' not found" -- which is why a directory is its own input
# now, rather than a lock file that happens to be one. A lock file is the graph
# an ecosystem resolved; a directory is what is on disk.
#
# Underneath it is syft either way, which reads Go build info out of compiled
# binaries, so the module graphs of the tools we built come along without their
# lock files being read a second time.
#
# Two environments, chosen from the triggering ref, matching sbomify-action:
#   * staging     -- every push to master -> stage.sbomify.com
#   * production  -- a published release  -> app.sbomify.com
name: sboms

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sboms-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # What we build from.
  # ---------------------------------------------------------------------
  sources:
    name: source ${{ matrix.name }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to mint the GitHub OIDC JWT
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go
            component_name: sbom-tools - Go Stack
            staging_id: RTJwLK2FfnCf
            prod_id: Z3h0vxP1WMTs
            lockfile: go.mod
          - name: rust
            component_name: sbom-tools - Rust Stack
            staging_id: Cc1VJdfrm72W
            prod_id: lTIkL5r8HjYt
            lockfile: Cargo.lock
          # cdxgen and its 197 transitive packages. Pinned here since the
          # bundle stopped shipping upstream's prebuilt binary, and until now
          # nothing described them.
          - name: javascript
            component_name: sbom-tools - JavaScript Stack
            staging_id: yZ16icN0OIMN
            prod_id: WapGqhUUErEZ
            lockfile: bun.lock
          # The CycloneDX build plugins, as additional packages rather than a
          # scan. tools/pom.xml and tools/build.gradle pin versions where
          # Dependabot can maintain them; neither is a project. The pom
          # declares no dependencies and the gradle file is a bare buildscript
          # block, so a generator pointed at either resolves nothing -- cdxgen
          # failed with "null null". The plugins are real supply chain all the
          # same: Maven, Gradle and sbt fetch them at run time and they shape
          # every JVM SBOM we produce, while appearing in nothing we ship.
          - name: build-plugins
            component_name: sbom-tools - Build Plugins
            staging_id: OaGapU0irAlf
            prod_id: aVlfJRUyWiai
            lockfile: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # workflow_run always runs the workflow from the default branch but
      # checks out the commit that was built, so the first run after adding a
      # manifest looks for a file that commit does not have. Skip rather than
      # fail: the next build has it, and a row that cannot describe anything
      # should not be reported as a broken upload.
      - id: present
        run: |
          if [ "${{ matrix.lockfile }}" = "none" ] || [ -e "${{ matrix.lockfile }}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.lockfile }} is not in this commit yet; skipping"
          fi

      # Read from the manifests Dependabot maintains, so the listed versions
      # cannot drift from the pins.
      - name: List the build plugins
        if: matrix.lockfile == 'none'
        run: python3 scripts/plugin_purls.py | tee additional_packages.txt

      - id: cfg
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$HEAD_BRANCH" == v* ]]; then
            {
              echo "is_prod=true"
              echo "version=${HEAD_BRANCH}"
              echo "api_base_url=https://app.sbomify.com"
              echo "oidc_audience=sbomify.com"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "is_prod=false"
              echo "version=${HEAD_SHA:0:7}"
              echo "api_base_url=https://stage.sbomify.com"
              echo "oidc_audience=stage.sbomify.com"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: sbomify/sbomify-action@master
        if: steps.present.outputs.found == 'true'
        env:
          API_BASE_URL: ${{ steps.cfg.outputs.api_base_url }}
          OIDC_AUDIENCE: ${{ steps.cfg.outputs.oidc_audience }}
          COMPONENT_ID: ${{ steps.cfg.outputs.is_prod == 'true' && matrix.prod_id || matrix.staging_id }}
          COMPONENT_NAME: ${{ matrix.component_name }}
          COMPONENT_VERSION: ${{ steps.cfg.outputs.version }}
          LOCK_FILE: ${{ matrix.lockfile }}
          ADDITIONAL_PACKAGES_FILE: ${{ matrix.lockfile == 'none' && 'additional_packages.txt' || '' }}
          SBOM_FORMAT: cyclonedx
          UPLOAD: 'true'
          AUGMENT: 'true'
          ENRICH: 'true'
          OUTPUT_FILE: sbom-tools-${{ matrix.name }}.cdx.json
          SBOMIFY_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache

  # ---------------------------------------------------------------------
  # What we ship. Scanned as assembled, by the syft inside each bundle.
  # ---------------------------------------------------------------------
  bundles:
    name: bundle ${{ matrix.bundle }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {bundle: go, prod_id: f2EIcOesNBBZ, staging_id: F7TPEUB0vmhr}
          - {bundle: rust, prod_id: LYBjrvuwGdyC, staging_id: eHOagG2h7bp4}
          - {bundle: syft, prod_id: Ro74uVXBfQSW, staging_id: XuUbFaWyXnmJ}
          - {bundle: sigstore, prod_id: qVe2lfAnW5h2, staging_id: l7qIZjVDNF4J}
          - {bundle: cdxgen, prod_id: eRNnEiShDEaa, staging_id: WMs0DX7QKg83}
          - {bundle: jvm, prod_id: hpeisMIpRHU7, staging_id: mOTJsOzjZPi4}
          - {bundle: dotnet, prod_id: WRDnZcyYlXLB, staging_id: awnaRBPzntLv}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: cfg
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$HEAD_BRANCH" == v* ]]; then
            {
              echo "is_prod=true"
              echo "release=${HEAD_BRANCH}"
              echo "version=${HEAD_BRANCH}"
              echo "api_base_url=https://app.sbomify.com"
              echo "oidc_audience=sbomify.com"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "is_prod=false"
              echo "release=tools-rolling"
              echo "version=${HEAD_SHA:0:7}"
              echo "api_base_url=https://stage.sbomify.com"
              echo "oidc_audience=stage.sbomify.com"
            } >> "$GITHUB_OUTPUT"
          fi

      # amd64 only. The two architectures hold the same tools at the same
      # versions and differ in machine code, which an SBOM does not describe --
      # two documents would differ only in their file hashes.
      - name: Unpack the published bundle and describe it with its own syft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET="${{ matrix.bundle }}-linux-amd64.tar.gz"
          gh release download "${{ steps.cfg.outputs.release }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir . --clobber
          PREFIX="$PWD/unpacked"
          mkdir -p "$PREFIX"
          tar xzf "$ASSET" -C "$PREFIX"
          # The scanner, from the bundle whose whole purpose is to carry it.
          gh release download "${{ steps.cfg.outputs.release }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "syft-linux-amd64.tar.gz" --dir . --clobber
          mkdir -p scanner
          tar xzf syft-linux-amd64.tar.gz -C scanner
          ./scanner/bin/syft scan "dir:$PREFIX" \
            -o "cyclonedx-json=$PWD/bundle-${{ matrix.bundle }}.cdx.json" \
            --source-name "sbom-tools-${{ matrix.bundle }}"

      - uses: sbomify/sbomify-action@master
        env:
          API_BASE_URL: ${{ steps.cfg.outputs.api_base_url }}
          OIDC_AUDIENCE: ${{ steps.cfg.outputs.oidc_audience }}
          COMPONENT_ID: ${{ steps.cfg.outputs.is_prod == 'true' && matrix.prod_id || matrix.staging_id }}
          COMPONENT_NAME: sbom-tools - ${{ matrix.bundle }} bundle
          COMPONENT_VERSION: ${{ steps.cfg.outputs.version }}
          SBOM_FILE: bundle-${{ matrix.bundle }}.cdx.json
          UPLOAD: 'true'
          AUGMENT: 'true'
          ENRICH: 'true'
          SBOMIFY_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache

      # An empty document uploads cleanly and describes nothing, which is the
      # failure this workflow exists to prevent.
      - name: Refuse an empty bundle SBOM
        run: |
          python3 - <<'EOF'
          import json
          import sys

          document = json.load(open("bundle-${{ matrix.bundle }}.cdx.json"))
          count = len(document.get("components") or [])
          print(f"::notice::${{ matrix.bundle }} bundle: {count} components")
          sys.exit(0 if count else "the bundle SBOM is empty")
          EOF
