---
# The whole point of this repository: the tools it builds are pinned in their
# ecosystems' own lockfiles, so Dependabot maintains the versions and each
# bump lands as a reviewable PR that rebuilds and re-attests the binaries.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # cdxgen, pinned in package.json/bun.lock. The bundle ships upstream's
  # prebuilt binary rather than anything built from this, but the version has
  # to live somewhere a bot can raise a PR against.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # The .NET SDK, pinned in global.json.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # The CycloneDX build plugins. Nothing here is compiled -- Maven, Gradle and
  # sbt fetch these themselves at run time, driven by sbomify-action through an
  # init script so a user's build files are never edited. The manifests exist
  # so the versions are watched by a bot rather than sitting as literals.
  #
  # They live here rather than in the action because this repository owns what
  # the JVM bundle can do, and the versions ship inside that bundle.
  - package-ecosystem: "maven"
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # Separate from maven because the Gradle plugin is published to the Gradle
  # Plugin Portal, not Maven Central, which carries only stale versions of it.
  - package-ecosystem: "gradle"
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

