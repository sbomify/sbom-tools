---
# The whole point of this repository: the tools it builds are pinned in their
# ecosystems' own lockfiles, so Dependabot maintains the versions and each
# bump lands as a reviewable PR that rebuilds and re-attests the binaries.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
