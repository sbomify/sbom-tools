# What each ecosystem bundle contains.
#
# A bundle is one relocatable archive holding everything an ecosystem needs:
# the tool we compile, plus the runtime it shells out to. It unpacks into any
# writable directory and runs from there -- no system install, no root, and
# nothing to resolve at run time beyond this one download.
#
# "built" entries come from the lockfiles in this repository and are compiled
# by .github/workflows/build.yml. "upstream" entries are self-hosting
# toolchains: building rustc needs a rustc (src/stage0 downloads one from the
# very URL below), building Go needs Go >= 1.24.6, building a JDK needs a boot
# JDK, and Maven builds with Maven. Compiling them from source would start by
# trusting the binary it is meant to replace, so they are pinned by the
# vendor's published digest instead -- which is the same bootstrap reasoning
# that keeps cosign vendor-pinned.

[bundle.go]
description = "cyclonedx-gomod and the Go toolchain it invokes"
# syft is here for SPDX. The native CycloneDX tools -- cyclonedx-gomod,
# cargo-cyclonedx, the Maven/Gradle/sbt plugins -- emit CycloneDX and
# nothing else, so a bundle without syft can serve only one of the two
# formats. A bundle should be able to answer either question on its own.
built = ["cyclonedx-gomod", "syft"]
env = { GOMODCACHE = "{prefix}/.gomodcache", GOCACHE = "{prefix}/.gocache", GOPATH = "{prefix}/.gopath" }

  [bundle.go.upstream.go]
  # From the toolchain directive in go.mod, which Dependabot's gomod updater
  # already maintains for the tools built here.
  version_from = { file = "go.mod" }
  strip_container = true
  [bundle.go.upstream.go.amd64]
  url = "https://go.dev/dl/go{version}.linux-amd64.tar.gz"
  sha256 = "ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5"
  [bundle.go.upstream.go.arm64]
  url = "https://go.dev/dl/go{version}.linux-arm64.tar.gz"
  sha256 = "3f4227ce7b206a513e794f1393adb473a07b46e94d18bd15d1c684bbb7319797"

[bundle.rust]
description = "cargo-cyclonedx with the cargo and rustc it shells out to"
# syft is here for SPDX. The native CycloneDX tools -- cyclonedx-gomod,
# cargo-cyclonedx, the Maven/Gradle/sbt plugins -- emit CycloneDX and
# nothing else, so a bundle without syft can serve only one of the two
# formats. A bundle should be able to answer either question on its own.
built = ["cargo-cyclonedx", "syft"]
env = { CARGO_HOME = "{prefix}/.cargo" }
# rust-std is deliberately absent: cargo-cyclonedx compiles nothing. Verified
# by deleting lib/rustlib from a full toolchain, which changes nothing, while
# deleting the rest of lib/ breaks it. Saves 181MB.

  [bundle.rust.upstream.cargo]
  version = "1.97.1"
  strip_container = true
  payload = "cargo"
  # rust-installer bookkeeping listing what install.sh would copy. We do not
  # run install.sh, and both components ship one, so keeping them would just
  # be two files fighting over the same name.
  exclude = ["manifest.in"]
  [bundle.rust.upstream.cargo.amd64]
  url = "https://static.rust-lang.org/dist/cargo-1.97.1-x86_64-unknown-linux-gnu.tar.xz"
  sha256 = "e1be5f5ff7f7f80ca506fb65770b759edbdc6d303781ed71c5de8ec8a8394779"
  [bundle.rust.upstream.cargo.arm64]
  url = "https://static.rust-lang.org/dist/cargo-1.97.1-aarch64-unknown-linux-gnu.tar.xz"
  sha256 = "8f70bcaccea5ba4db187c3fd4d64e24592b4e16af513497201f5909d61691dbe"

  [bundle.rust.upstream.rustc]
  version = "1.97.1"
  strip_container = true
  payload = "rustc"
  # rust-installer bookkeeping listing what install.sh would copy. We do not
  # run install.sh, and both components ship one, so keeping them would just
  # be two files fighting over the same name.
  exclude = ["manifest.in"]
  [bundle.rust.upstream.rustc.amd64]
  url = "https://static.rust-lang.org/dist/rustc-1.97.1-x86_64-unknown-linux-gnu.tar.xz"
  sha256 = "9819d0a32d56bd339585319c80260e332779f5541fd66838ab7e016d6c814819"
  [bundle.rust.upstream.rustc.arm64]
  url = "https://static.rust-lang.org/dist/rustc-1.97.1-aarch64-unknown-linux-gnu.tar.xz"
  sha256 = "b344b81f0cd4c2246c7da8b197fe7a339d7dd02bb15cb69b2524115d9c75224c"

[bundle.syft]
description = "syft, for container images and as the filesystem fallback"
built = ["syft"]

[bundle.sigstore]
description = "cosign and crane, for registry attestations"
built = ["cosign", "crane"]

[bundle.cdxgen]
description = "cdxgen alone, for the ecosystems it resolves without a toolchain"
# syft is here for SPDX. The native CycloneDX tools -- cyclonedx-gomod,
# cargo-cyclonedx, the Maven/Gradle/sbt plugins -- emit CycloneDX and
# nothing else, so a bundle without syft can serve only one of the two
# formats. A bundle should be able to answer either question on its own.
built = ["syft", "cdxgen-launcher"]
# cdxgen is one of ours, so it comes from the lockfile that pins it --
# bun.lock records a sha512 for it and 197 other packages, and
# --frozen-lockfile refuses anything that does not match. Optional
# dependencies are omitted: they are per-platform plugin binaries worth
# 375MB that nothing here uses, and the output is identical without them.
npm_install = true
# The one thing here we do not compile, and not for want of trying. cdxgen's
# published binary is a bundled Node application that resolves its data files
# against __dirname, so `bun build --compile` of the package in its own
# lockfile yields a binary that dies with "ENOENT: /data/lic-mapping.json".
# Upstream needs a 599-line build script in a distro container to produce
# theirs; a worse copy of an artifact they already test helps nobody.

  # bun, pinned here because it is a runtime rather than one of our tools --
  # the same category as the JDK, and in no lockfile of ours. cdxgen itself is
  # ours and so comes from bun.lock below.
  #
  # bun rather than Node, and the counts alone argue the other way: for axios
  # cdxgen reports 39 components under Node and 9 under bun. The 9 are right.
  # axios declares follow-redirects, form-data and proxy-from-env, and bun
  # returns exactly those plus their transitive closure. Node's extra thirty
  # are Node builtins -- fs, assert, events -- and devDependencies such as
  # gulp and handlebars, returned despite --required-only. A bigger document
  # describing things the project does not depend on is not a better one.
  [bundle.cdxgen.upstream.bun]
  version = "1.3.14"
  # The zip is bun-linux-x64/bun -- one directory holding the binary and
  # nothing else -- so stripping the wrapper and landing it in bin/ puts it
  # straight onto PATH.
  strip_container = true
  into = "bin"
  [bundle.cdxgen.upstream.bun.amd64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip"
  sha256 = "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
  [bundle.cdxgen.upstream.bun.arm64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip"
  sha256 = "a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b"
[bundle.jvm]
# Records the CycloneDX plugin versions in bundle.toml; see PLUGIN_PINS.
build_plugins = true
description = "cdxgen with the JDK, Maven, Gradle and sbt it shells out to"
# syft is here for SPDX. The native CycloneDX tools -- cyclonedx-gomod,
# cargo-cyclonedx, the Maven/Gradle/sbt plugins -- emit CycloneDX and
# nothing else, so a bundle without syft can serve only one of the two
# formats. A bundle should be able to answer either question on its own.
built = ["syft", "cdxgen-launcher"]
# cdxgen is one of ours, so it comes from the lockfile that pins it --
# bun.lock records a sha512 for it and 197 other packages, and
# --frozen-lockfile refuses anything that does not match. Optional
# dependencies are omitted: they are per-platform plugin binaries worth
# 375MB that nothing here uses, and the output is identical without them.
npm_install = true
env = { JAVA_HOME = "{prefix}/jdk", MAVEN_ARGS = "-Dmaven.repo.local={prefix}/repository", GRADLE_USER_HOME = "{prefix}/.gradle", SBT_OPTS = "-Dsbt.global.base={prefix}/.sbt -Dsbt.ivy.home={prefix}/.ivy2 -Dsbt.coursier.home={prefix}/.coursier" }
# Self-contained on purpose: cdxgen shells out to the build tool, and none of
# them start without a JVM. Measured with cdxgen alone and no toolchain, a
# Gradle project yields 0 components and an sbt project crashes outright --
# and a 0-component SBOM still looks like success, which is exactly the silent
# failure this is meant to stop. All three build tools share one JDK here;
# separate bundles would ship 190MB of JDK three times.

  # The build-tool wrappers a project may commit, and what to run instead when
  # one of them cannot. A consumer prefers the project's wrapper -- projects
  # pin a build-tool version for a reason, and the pinned one here often does
  # not suit them -- but when the wrapper cannot run it has to know two things
  # to recover: which of our tools stands in for it, and which file the
  # wrapper cannot bootstrap without.
  #
  # Both are facts about this toolchain rather than about any consumer, and
  # the same reasoning that moved the plugin pins here applies: a consumer
  # that hardcodes "gradlew means gradle" is a second place describing this
  # bundle, free to disagree with it. Teaching a new bundle about its own
  # wrappers should not require changing anything downstream.
  #
  # `needs` exists because a wrapper script is small while the jar that does
  # the work is a binary, and projects that refuse to commit binaries
  # gitignore it and let the script fetch it on first run. That fetch shells
  # out to curl. apache/kafka is the case in hand: no committed
  # gradle-wrapper.jar, and a consumer without curl gets three "curl: not
  # found" lines and then "Unable to access jarfile".
  #
  # Maven declares no `needs`: mvnw fails at run time instead, validating its
  # own jar against the checksum in the project's maven-wrapper.properties and
  # refusing when they disagree (apache/flink). Nothing checkable in advance,
  # so there is nothing honest to put here.
  [bundle.jvm.wrappers.gradle]
  script = "gradlew"
  tool = "gradle"
  needs = "gradle/wrapper/gradle-wrapper.jar"

  [bundle.jvm.wrappers.maven]
  script = "mvnw"
  tool = "mvn"

  # bun, pinned here because it is a runtime rather than one of our tools --
  # the same category as the JDK, and in no lockfile of ours. cdxgen itself is
  # ours and so comes from bun.lock below.
  #
  # bun rather than Node, and the counts alone argue the other way: for axios
  # cdxgen reports 39 components under Node and 9 under bun. The 9 are right.
  # axios declares follow-redirects, form-data and proxy-from-env, and bun
  # returns exactly those plus their transitive closure. Node's extra thirty
  # are Node builtins -- fs, assert, events -- and devDependencies such as
  # gulp and handlebars, returned despite --required-only. A bigger document
  # describing things the project does not depend on is not a better one.
  [bundle.jvm.upstream.bun]
  version = "1.3.14"
  # The zip is bun-linux-x64/bun -- one directory holding the binary and
  # nothing else -- so stripping the wrapper and landing it in bin/ puts it
  # straight onto PATH.
  strip_container = true
  into = "bin"
  [bundle.jvm.upstream.bun.amd64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip"
  sha256 = "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
  [bundle.jvm.upstream.bun.arm64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip"
  sha256 = "a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b"
  [bundle.jvm.upstream.jdk]
  version = "21.0.13+9"
  strip_container = true
  into = "jdk"
  # emSign roots whose intermediates' private keys were compromised
  # (CVE-2026-114820, JDK-8395690). OpenJDK says to remove G1, G2 and ECC G3,
  # and Mozilla removed ECC G3. Temurin 21.0.12 shipped G1 and ECC G3, and
  # 21.0.13 still ships G1. Taken out of cacerts at assembly; a listed root
  # the JDK no longer carries is skipped, one still there fails the build.
  # Matched by SHA-256 because vendors alias the same root differently.
  distrust_sha256 = [
    "40:F6:AF:03:46:A9:9A:A1:CD:1D:55:5A:4E:9C:CE:62:C7:F9:63:46:03:EE:40:66:15:83:3D:C8:C8:D0:03:67", # emSign Root CA - G1
    "86:A1:EC:BA:08:9C:4A:8D:3B:BE:27:34:C6:12:BA:34:1D:81:3E:04:3C:F9:E8:A8:62:CD:5C:57:A3:6B:BE:6B", # emSign ECC Root CA - G3
  ]
  [bundle.jvm.upstream.jdk.amd64]
  url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz"
  sha256 = "d7f5d5cf865a2902b70ff549b97586a7d3f234e016f041ab447ea740c7d66d1c"
  [bundle.jvm.upstream.jdk.arm64]
  url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.13_9.tar.gz"
  sha256 = "e3522e707fc7dbe2a72c30746b1e7068301a0213ecd213d4491f35a14eb55578"

  [bundle.jvm.upstream.maven]
  version = "3.9.16"
  strip_container = true
  into = "maven"
  [bundle.jvm.upstream.maven.amd64]
  url = "https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz"
  sha512 = "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
  [bundle.jvm.upstream.maven.arm64]
  url = "https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz"
  sha512 = "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"

  [bundle.jvm.upstream.gradle]
  version = "9.8.2"
  strip_container = true
  into = "gradle"
  [bundle.jvm.upstream.gradle.amd64]
  url = "https://services.gradle.org/distributions/gradle-9.8.2-bin.zip"
  sha256 = "21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607"
  [bundle.jvm.upstream.gradle.arm64]
  url = "https://services.gradle.org/distributions/gradle-9.8.2-bin.zip"
  sha256 = "21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607"

  # Gradle and sbt are JVM applications, so one architecture-independent
  # archive serves both. Only the JDK below differs per architecture.
  # sbt 1.x, not 2.x. Picking "latest" put 2.0.5 here, and 2.x is a major
  # rewrite: its launcher dies with a ClassCastException before any project
  # loads, and cdxgen's dependency-graph plugin is published only for sbt 1.x
  # -- it fails to resolve sbt-dependency-graph_sbt2_3. Real projects pin 1.x
  # too (cats pins 1.10.0), and the launcher honours project/build.properties,
  # so shipping 1.x also lets a project select its own.
  [bundle.jvm.upstream.sbt]
  version = "1.12.14"
  strip_container = true
  into = "sbt"
  [bundle.jvm.upstream.sbt.amd64]
  url = "https://github.com/sbt/sbt/releases/download/v1.12.14/sbt-1.12.14.tgz"
  sha256 = "cd17daae220ff264faa4251334522444518584f0eb2ee82da01523a9b9002b7e"
  [bundle.jvm.upstream.sbt.arm64]
  url = "https://github.com/sbt/sbt/releases/download/v1.12.14/sbt-1.12.14.tgz"
  sha256 = "cd17daae220ff264faa4251334522444518584f0eb2ee82da01523a9b9002b7e"

[bundle.php]
description = "cdxgen with the PHP runtime and Composer it shells out to"
# syft is here for SPDX. The native CycloneDX tools -- cyclonedx-gomod,
# cargo-cyclonedx, the Maven/Gradle/sbt plugins -- emit CycloneDX and
# nothing else, so a bundle without syft can serve only one of the two
# formats. A bundle should be able to answer either question on its own.
#
# php is "built" rather than "upstream" because php.net publishes no Linux
# binaries -- only source. It is compiled from the tarball pinned in
# php-release.json, by the digest php.net publishes for it, and comes out
# static-pie linked like everything else built here.
built = ["syft", "cdxgen-launcher", "php"]
# cdxgen is one of ours, so it comes from the lockfile that pins it --
# bun.lock records a sha512 for it and 197 other packages, and
# --frozen-lockfile refuses anything that does not match. Optional
# dependencies are omitted: they are per-platform plugin binaries worth
# 375MB that nothing here uses, and the output is identical without them.
npm_install = true
env = { COMPOSER_HOME = "{prefix}/.composer", COMPOSER_CACHE_DIR = "{prefix}/.composer-cache", COMPOSER_ALLOW_SUPERUSER = "1" }
# Without Composer, cdxgen cannot read a composer.json at all: it stops with
# "No composer version found. Check if composer is installed and available in
# PATH", falls through to syft, and syft writes a document with no components
# -- which still exits 0.
#
# Measured against real libraries, which is where this matters: PHP libraries
# gitignore composer.lock because the consuming application resolves it, and
# that is most of PHP on GitHub. guzzle goes from 0 components to 8 and Slim
# from 0 to 7. Two of the four tested stay at 0 for reasons of their own
# (monolog's dev dependencies require monolog, and the root package of a
# shallow clone has no version to satisfy them), so this is a large
# improvement rather than a complete fix.
#
# A committed composer.lock never needed any of this -- cdxgen parses that as
# data.
#
# The interpreter is deliberately minimal: phar to run composer.phar, openssl
# for packagist, zlib, iconv (composer refuses to start without iconv or
# mbstring), and the handful composer itself requires. Extensions a *project*
# declares are irrelevant here because nothing is installed -- only resolved.
# Verified rather than assumed: against guzzle, Slim and laravel/framework
# this minimal build returns exactly what Debian's full-featured php-cli
# returns, 8/8, 7/7 and 0/0.

  # bun, pinned here because it is a runtime rather than one of our tools --
  # the same category as the JDK, and in no lockfile of ours. cdxgen itself is
  # ours and so comes from bun.lock below.
  #
  # bun rather than Node, and the counts alone argue the other way: for axios
  # cdxgen reports 39 components under Node and 9 under bun. The 9 are right.
  # axios declares follow-redirects, form-data and proxy-from-env, and bun
  # returns exactly those plus their transitive closure. Node's extra thirty
  # are Node builtins -- fs, assert, events -- and devDependencies such as
  # gulp and handlebars, returned despite --required-only. A bigger document
  # describing things the project does not depend on is not a better one.
  [bundle.php.upstream.bun]
  version = "1.3.14"
  # The zip is bun-linux-x64/bun -- one directory holding the binary and
  # nothing else -- so stripping the wrapper and landing it in bin/ puts it
  # straight onto PATH.
  strip_container = true
  into = "bin"
  [bundle.php.upstream.bun.amd64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip"
  sha256 = "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
  [bundle.php.upstream.bun.arm64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip"
  sha256 = "a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b"

  # composer.phar carries `#!/usr/bin/env php`, so landing it in bin/ named
  # `composer` and marking it executable is all it needs -- the php built
  # above is on the same PATH. No wrapper script, and nothing for a consumer
  # to know.
  #
  # getcomposer.org is Composer's own distribution channel, and the phar is
  # bytecode: identical on every architecture. Both entries therefore name
  # the same artefact and the same digest. Listing it once per arch anyway
  # keeps the schema uniform rather than making this the one component shaped
  # differently.
  [bundle.php.upstream.composer]
  version = "2.10.3"
  kind = "raw"
  bin_name = "composer"
  [bundle.php.upstream.composer.amd64]
  url = "https://getcomposer.org/download/{version}/composer.phar"
  sha256 = "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6"
  [bundle.php.upstream.composer.arm64]
  url = "https://getcomposer.org/download/{version}/composer.phar"
  sha256 = "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6"

[bundle.dotnet]
description = "cdxgen with the .NET SDK it needs to restore packages.lock.json"
# syft is here for SPDX. The native CycloneDX tools -- cyclonedx-gomod,
# cargo-cyclonedx, the Maven/Gradle/sbt plugins -- emit CycloneDX and
# nothing else, so a bundle without syft can serve only one of the two
# formats. A bundle should be able to answer either question on its own.
built = ["syft", "cdxgen-launcher"]
# cdxgen is one of ours, so it comes from the lockfile that pins it --
# bun.lock records a sha512 for it and 197 other packages, and
# --frozen-lockfile refuses anything that does not match. Optional
# dependencies are omitted: they are per-platform plugin binaries worth
# 375MB that nothing here uses, and the output is identical without them.
npm_install = true
env = { DOTNET_CLI_HOME = "{prefix}/.dotnet", NUGET_PACKAGES = "{prefix}/.nuget", DOTNET_CLI_TELEMETRY_OPTOUT = "1" }
# Without the SDK, cdxgen produces no SBOM at all for packages.lock.json --
# measured, not assumed.

  # bun, pinned here because it is a runtime rather than one of our tools --
  # the same category as the JDK, and in no lockfile of ours. cdxgen itself is
  # ours and so comes from bun.lock below.
  #
  # bun rather than Node, and the counts alone argue the other way: for axios
  # cdxgen reports 39 components under Node and 9 under bun. The 9 are right.
  # axios declares follow-redirects, form-data and proxy-from-env, and bun
  # returns exactly those plus their transitive closure. Node's extra thirty
  # are Node builtins -- fs, assert, events -- and devDependencies such as
  # gulp and handlebars, returned despite --required-only. A bigger document
  # describing things the project does not depend on is not a better one.
  [bundle.dotnet.upstream.bun]
  version = "1.3.14"
  # The zip is bun-linux-x64/bun -- one directory holding the binary and
  # nothing else -- so stripping the wrapper and landing it in bin/ puts it
  # straight onto PATH.
  strip_container = true
  into = "bin"
  [bundle.dotnet.upstream.bun.amd64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip"
  sha256 = "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
  [bundle.dotnet.upstream.bun.arm64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip"
  sha256 = "a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b"
  [bundle.dotnet.upstream.dotnet]
  # From global.json, which Dependabot's dotnet-sdk updater maintains.
  version_from = { file = "global.json" }
  into = "dotnet"
  # The SDK ships its entry point as <root>/dotnet, not <root>/bin/dotnet, so
  # the payload directory is itself the bin directory.
  bin_dir = "dotnet"
