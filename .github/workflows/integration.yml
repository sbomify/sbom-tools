---
# Test the bundles against real projects, in both formats.
#
# build.yml proves a bundle assembles and attests. It cannot prove the tools
# inside it produce an SBOM of a real project, and every defect worth finding
# so far has been of the second kind: the .NET SDK sitting at the payload root
# so nothing reached PATH; sbt 2.x whose launcher dies before a build loads; a
# Gradle plugin class spelled CyclonedxPlugin rather than CycloneDxPlugin.
# Each assembled, verified and published perfectly well.
#
# Runs after build.yml so it exercises what was just published, and on a
# schedule so upstream drift in the projects themselves surfaces here rather
# than in someone's pipeline.
name: Integration

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  schedule:
    # Weekly. The projects are pinned to tags, so this catches rot in the
    # tools and registries rather than in the projects.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      bundle:
        description: "Only test this bundle"
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.bundle }} (${{ matrix.arch }})
    # A bundle can take a while: Keycloak is a large reactor and Gradle
    # resolves from the network.
    timeout-minutes: 90
    # Matched to the architecture being tested. Until now this ran amd64 only,
    # so half of what we publish had generated an SBOM exactly never --
    # build.yml executes each arm64 binary for its version string, which proves
    # it loads, not that it can resolve a real project's dependencies. An
    # immutable release should not be the first time that is tried.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        bundle: [jvm, go, rust, dotnet, cdxgen]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Cloned projects and unpacked bundles, keyed on the manifests that
      # decide them. Keycloak alone is a 90MB clone.
      - name: Cache projects and bundles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sbom-tools-it
          key: it-${{ matrix.bundle }}-${{ matrix.arch }}-${{ hashFiles('tests/projects.toml', 'bundles.toml') }}
          restore-keys: it-${{ matrix.bundle }}-${{ matrix.arch }}-

      - name: Run
        if: github.event.inputs.bundle == '' || github.event.inputs.bundle == matrix.bundle
        run: python tests/integration.py --bundle ${{ matrix.bundle }} --arch ${{ matrix.arch }}

      - name: Report
        if: always()
        run: |
          echo "bundle ${{ matrix.bundle }} (${{ matrix.arch }}) - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
