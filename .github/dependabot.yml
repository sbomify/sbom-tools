---
# The whole point of this repository: the tools it builds are pinned in their
# ecosystems' own lockfiles, so Dependabot maintains the versions and each
# bump lands as a reviewable PR that rebuilds and re-attests the binaries.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # cdxgen, pinned in package.json/bun.lock. The bundle ships upstream's
  # prebuilt binary rather than anything built from this, but the version has
  # to live somewhere a bot can raise a PR against.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # The .NET SDK, pinned in global.json.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

