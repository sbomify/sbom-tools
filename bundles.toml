[bundle.cdxgen]
description = "cdxgen alone, for the ecosystems it resolves without a toolchain"
# syft is here for SPDX. The native CycloneDX tools -- cyclonedx-gomod,
# cargo-cyclonedx, the Maven/Gradle/sbt plugins -- emit CycloneDX and
# nothing else, so a bundle without syft can serve only one of the two
# formats. A bundle should be able to answer either question on its own.
built = ["syft", "cdxgen-launcher"]
# cdxgen is one of ours, so it comes from the lockfile that pins it --
# bun.lock records a sha512 for it and 197 other packages, and
# --frozen-lockfile refuses anything that does not match. Optional
# dependencies are omitted: they are per-platform plugin binaries worth
# 375MB that nothing here uses, and the output is identical without them.
npm_install = true
# The one thing here we do not compile, and not for want of trying. cdxgen's
# published binary is a bundled Node application that resolves its data files
# against __dirname, so `bun build --compile` of the package in its own
# lockfile yields a binary that dies with "ENOENT: /data/lic-mapping.json".
# Upstream needs a 599-line build script in a distro container to produce
# theirs; a worse copy of an artifact they already test helps nobody.

  # bun, pinned here because it is a runtime rather than one of our tools --
  # the same category as the JDK, and in no lockfile of ours. cdxgen itself is
  # ours and so comes from bun.lock below.
  #
  # bun rather than Node, and the counts alone argue the other way: for axios
  # cdxgen reports 39 components under Node and 9 under bun. The 9 are right.
  # axios declares follow-redirects, form-data and proxy-from-env, and bun
  # returns exactly those plus their transitive closure. Node's extra thirty
  # are Node builtins -- fs, assert, events -- and devDependencies such as
  # gulp and handlebars, returned despite --required-only. A bigger document
  # describing things the project does not depend on is not a better one.
  [bundle.cdxgen.upstream.bun]
  version = "1.3.14"
  # The zip is bun-<platform>/bun -- one directory holding the binary and
  # nothing else -- so stripping the wrapper and landing it in bin/ puts it
  # straight onto PATH.
  strip_container = true
  into = "bin"
  [bundle.cdxgen.upstream.bun.linux-amd64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip"
  sha256 = "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
  [bundle.cdxgen.upstream.bun.linux-arm64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip"
  sha256 = "a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b"
  [bundle.cdxgen.upstream.bun.darwin-amd64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-x64.zip"
  sha256 = "4183df3374623e5bab315c547cfa0974533cd457d86b73b639f7a87974cd6633"
  [bundle.cdxgen.upstream.bun.darwin-arm64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-aarch64.zip"
  sha256 = "d8b96221828ad6f97ac7ac0ab7e95872341af763001e8803e8267652c2652620"
[bundle.jvm]
# Records the CycloneDX plugin versions in bundle.toml; see PLUGIN_PINS.
build_plugins = true
description = "cdxgen with the JDK, Maven, Gradle and sbt it shells out to"

# Everything [bundle.jvm] declares for itself comes before the first sub-table
# below it, and has to. TOML hands a bare key to whichever table was opened
# last, so while the wrappers block sat above these three they were read as
# keys of `wrappers.maven` -- and the jvm bundle shipped for two months with no
# syft, no cdxgen and none of the env below. Nothing failed: the archive
# assembled, attested and published, and every tool it did contain worked.

# syft is here for SPDX. The native CycloneDX tools -- cyclonedx-gomod,
# cargo-cyclonedx, the Maven/Gradle/sbt plugins -- emit CycloneDX and
# nothing else, so a bundle without syft can serve only one of the two
# formats. A bundle should be able to answer either question on its own.
built = ["syft", "cdxgen-launcher"]
# cdxgen is one of ours, so it comes from the lockfile that pins it --
# bun.lock records a sha512 for it and 197 other packages, and
# --frozen-lockfile refuses anything that does not match. Optional
# dependencies are omitted: they are per-platform plugin binaries worth
# 375MB that nothing here uses, and the output is identical without them.
npm_install = true
env = { JAVA_HOME = "{prefix}/jdk", MAVEN_ARGS = "-Dmaven.repo.local={prefix}/repository", GRADLE_USER_HOME = "{prefix}/.gradle", SBT_OPTS = "-Dsbt.global.base={prefix}/.sbt -Dsbt.ivy.home={prefix}/.ivy2 -Dsbt.coursier.home={prefix}/.coursier" }
# Self-contained on purpose: cdxgen shells out to the build tool, and none of
# them start without a JVM. Measured with cdxgen alone and no toolchain, a
# Gradle project yields 0 components and an sbt project crashes outright --
# and a 0-component SBOM still looks like success, which is exactly the silent
# failure this is meant to stop. All three build tools share one JDK here;
# separate bundles would ship 190MB of JDK three times.

  # The build-tool wrappers a project may commit, and what to run instead when
  # one of them cannot. A consumer prefers the project's wrapper -- projects
  # pin a build-tool version for a reason, and the pinned one here often does
  # not suit them -- but when the wrapper cannot run it has to know two things
  # to recover: which of our tools stands in for it, and which file the
  # wrapper cannot bootstrap without.
  #
  # Both are facts about this toolchain rather than about any consumer, and
  # the same reasoning that moved the plugin pins here applies: a consumer
  # that hardcodes "gradlew means gradle" is a second place describing this
  # bundle, free to disagree with it. Teaching a new bundle about its own
  # wrappers should not require changing anything downstream.
  #
  # `needs` exists because a wrapper script is small while the jar that does
  # the work is a binary, and projects that refuse to commit binaries
  # gitignore it and let the script fetch it on first run. That fetch shells
  # out to curl. apache/kafka is the case in hand: no committed
  # gradle-wrapper.jar, and a consumer without curl gets three "curl: not
  # found" lines and then "Unable to access jarfile".
  #
  # Maven declares no `needs`: mvnw fails at run time instead, validating its
  # own jar against the checksum in the project's maven-wrapper.properties and
  # refusing when they disagree (apache/flink). Nothing checkable in advance,
  # so there is nothing honest to put here.
  [bundle.jvm.wrappers.gradle]
  script = "gradlew"
  tool = "gradle"
  needs = "gradle/wrapper/gradle-wrapper.jar"

  [bundle.jvm.wrappers.maven]
  script = "mvnw"
  tool = "mvn"

  # bun, pinned here because it is a runtime rather than one of our tools --
  # the same category as the JDK, and in no lockfile of ours. cdxgen itself is
  # ours and so comes from bun.lock below.
  #
  # bun rather than Node, and the counts alone argue the other way: for axios
  # cdxgen reports 39 components under Node and 9 under bun. The 9 are right.
  # axios declares follow-redirects, form-data and proxy-from-env, and bun
  # returns exactly those plus their transitive closure. Node's extra thirty
  # are Node builtins -- fs, assert, events -- and devDependencies such as
  # gulp and handlebars, returned despite --required-only. A bigger document
  # describing things the project does not depend on is not a better one.
  [bundle.jvm.upstream.bun]
  version = "1.3.14"
  # The zip is bun-<platform>/bun -- one directory holding the binary and
  # nothing else -- so stripping the wrapper and landing it in bin/ puts it
  # straight onto PATH.
  strip_container = true
  into = "bin"
  [bundle.jvm.upstream.bun.linux-amd64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip"
  sha256 = "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
  [bundle.jvm.upstream.bun.linux-arm64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip"
  sha256 = "a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b"
  [bundle.jvm.upstream.bun.darwin-amd64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-x64.zip"
  sha256 = "4183df3374623e5bab315c547cfa0974533cd457d86b73b639f7a87974cd6633"
  [bundle.jvm.upstream.bun.darwin-arm64]
  url = "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-aarch64.zip"
  sha256 = "d8b96221828ad6f97ac7ac0ab7e95872341af763001e8803e8267652c2652620"
  [bundle.jvm.upstream.jdk]
  version = "21.0.12+8"
  strip_container = true
  into = "jdk"
  [bundle.jvm.upstream.jdk.linux-amd64]
  url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12_8.tar.gz"
  sha256 = "e4446ff06a276155697597cc0f1b15da004ff083f4964a35271ecee567177370"
  [bundle.jvm.upstream.jdk.linux-arm64]
  url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.12_8.tar.gz"
  sha256 = "eba38e871b02d407897bfe017ea35352dfc1420ef6d2112425b0c67325ca509d"
  # macOS Temurin is an application bundle: under the version-named wrapper it
  # is Contents/Home/{bin,lib,conf} plus Contents/MacOS and a _CodeSignature
  # seal over the bundle. Taking Contents/Home as the payload leaves jdk/bin
  # and jdk/lib exactly where the Linux archive puts them, so JAVA_HOME and
  # the bin_dirs in bundle.toml stay one value rather than two. The bundle seal
  # is dropped with the wrapper, which costs nothing: each Mach-O inside
  # carries its own signature, and that is what macOS checks before running
  # one.
  [bundle.jvm.upstream.jdk.darwin-amd64]
  payload = "Contents/Home"
  url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jdk_x64_mac_hotspot_21.0.12_8.tar.gz"
  sha256 = "6b85c260eea574a995eacd0b3ee23c8042aa93b23a08e6478edafca0a0333d7f"
  [bundle.jvm.upstream.jdk.darwin-arm64]
  payload = "Contents/Home"
  url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.12_8.tar.gz"
  sha256 = "021d629349ebc12a409faa517b837ec80ceee8f58a5ac85c788ecad07ca6881c"

  [bundle.jvm.upstream.maven]
  version = "3.9.16"
  strip_container = true
  into = "maven"
  [bundle.jvm.upstream.maven.linux-amd64]
  url = "https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz"
  sha512 = "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
  [bundle.jvm.upstream.maven.linux-arm64]
  url = "https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz"
  sha512 = "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
  [bundle.jvm.upstream.maven.darwin-amd64]
  url = "https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz"
  sha512 = "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
  [bundle.jvm.upstream.maven.darwin-arm64]
  url = "https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz"
  sha512 = "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"

  [bundle.jvm.upstream.gradle]
  version = "9.6.1"
  strip_container = true
  into = "gradle"
  [bundle.jvm.upstream.gradle.linux-amd64]
  url = "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip"
  sha256 = "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"
  [bundle.jvm.upstream.gradle.linux-arm64]
  url = "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip"
  sha256 = "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"
  [bundle.jvm.upstream.gradle.darwin-amd64]
  url = "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip"
  sha256 = "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"
  [bundle.jvm.upstream.gradle.darwin-arm64]
  url = "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip"
  sha256 = "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"

  # Maven, Gradle and sbt are JVM applications, so one platform-independent
  # archive serves all four platforms. Only the JDK above differs, and only
  # because a JVM has to be built for the machine it runs on.
  # sbt 1.x, not 2.x. Picking "latest" put 2.0.5 here, and 2.x is a major
  # rewrite: its launcher dies with a ClassCastException before any project
  # loads, and cdxgen's dependency-graph plugin is published only for sbt 1.x
  # -- it fails to resolve sbt-dependency-graph_sbt2_3. Real projects pin 1.x
  # too (cats pins 1.10.0), and the launcher honours project/build.properties,
